# The dependencies below mirror requirements.txt. Vercel installs from this file, so keep the two in step.

[project]
name = "medipass"
version = "0.1.0"
description = "MediPass, a traffic light for medicines with an AI care agent."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.143.0",
    "google-genai==2.29.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "solana==0.38.0",
    "solders==0.27.1",
    "uvicorn==0.54.0",
    "x402[httpx,svm]==2.25.0",
]


[tool.pyright]
pythonVersion = "3.10"
include = ["agent", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
